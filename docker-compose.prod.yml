# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: always
    ports: []
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    restart: always
    ports: []
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    restart: always
    environment:
      - DJANGO_DEBUG=False
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/destinations/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
