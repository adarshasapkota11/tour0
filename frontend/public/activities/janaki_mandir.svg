<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="650" cy="80" r="40" fill="#f59e0b" opacity="0.8"/>
  <!-- Temple base -->
  <rect x="250" y="350" width="300" height="150" fill="#dc2626" rx="4"/>
  <rect x="260" y="360" width="280" height="130" fill="#ef4444" rx="2"/>
  <!-- Pillars -->
  <rect x="280" y="350" width="12" height="150" fill="#fbbf24"/>
  <rect x="340" y="350" width="12" height="150" fill="#fbbf24"/>
  <rect x="448" y="350" width="12" height="150" fill="#fbbf24"/>
  <rect x="508" y="350" width="12" height="150" fill="#fbbf24"/>
  <!-- Arches -->
  <path d="M300,430 Q340,390 380,430" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <path d="M420,430 Q460,390 500,430" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <!-- Dome 1 -->
  <ellipse cx="340" cy="350" rx="70" ry="30" fill="#dc2626"/>
  <path d="M270,350 Q340,280 410,350" fill="#b91c1c"/>
  <!-- Dome 2 -->
  <ellipse cx="460" cy="350" rx="70" ry="30" fill="#dc2626"/>
  <path d="M390,350 Q460,280 530,350" fill="#b91c1c"/>
  <!-- Central spire -->
  <polygon points="400,200 380,280 420,280" fill="#fbbf24"/>
  <circle cx="400" cy="195" r="8" fill="#f59e0b"/>
  <!-- Decorative top -->
  <polygon points="340,320 340,300 350,290 360,300 360,320" fill="#fbbf24"/>
  <polygon points="440,320 440,300 450,290 460,300 460,320" fill="#fbbf24"/>
  <!-- Steps -->
  <rect x="230" y="500" width="340" height="15" fill="#92400e"/>
  <rect x="240" y="515" width="320" height="10" fill="#a16207"/>
  <rect x="220" y="525" width="360" height="25" fill="#78350f"/>
  <!-- Lamp -->
  <ellipse cx="400" cy="545" rx="8" ry="4" fill="#f59e0b"/>
  <rect x="398" y="535" width="4" height="10" fill="#92400e"/>
  <circle cx="400" cy="533" r="4" fill="#fbbf24" opacity="0.8"/>
  <text x="400" y="575" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#78350f">Janaki Mandir</text>
</svg>
