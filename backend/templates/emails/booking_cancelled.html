<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; margin: 0; padding: 0; background: #f8fafc; }
    .container { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; }
    .header { background: linear-gradient(135deg, #dc2626, #b91c1c); padding: 32px 24px; text-align: center; }
    .header h1 { color: #fff; font-size: 20px; margin: 0; }
    .body { padding: 32px 24px; }
    .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .value { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 20px; }
    .reason-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 12px 16px; color: #991b1b; font-size: 14px; margin-bottom: 20px; }
    .footer { padding: 20px 24px; text-align: center; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Booking Cancelled</h1>
    </div>
    <div class="body">
      <p>Hi {{ user.full_name|default:user.email }},</p>
      <p>Your booking for <strong>{{ item_name }}</strong> has been cancelled.</p>

      {% if cancel_reason %}
      <div class="label">Reason</div>
      <div class="reason-box">{{ cancel_reason }}</div>
      {% endif %}

      <p>If this was a mistake, you can create a new booking anytime.</p>
    </div>
    <div class="footer">
      &copy; TourNepal &mdash; Explore Nepal with confidence.
    </div>
  </div>
</body>
</html>
